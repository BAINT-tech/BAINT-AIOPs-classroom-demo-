<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BAINT OS – Classroom Assistant Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #f3f3f3;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.laptop {
  width: 960px;
  height: 650px;
  background: #000;
  border-radius: 28px;
  padding: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
}

.top-bar {
  height: 36px;
  background: #1c1c1c;
  border-radius: 18px 18px 0 0;
  color: #fff;
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-size: 14px;
  font-weight: bold;
}

.screen-shell {
  flex: 1;
  background: #f9fafb;
  border-radius: 0 0 28px 28px;
  margin-top: 6px;
  padding: 22px;
  overflow-y: auto;
}

.section { margin-bottom: 20px; }
.section h4 { margin: 0 0 8px; font-size: 15px; }

select, input {
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid #d1d5db;
  font-size: 14px;
  margin-right: 8px;
}

input[type="text"], input[type="email"] { width: 60%; }

.card {
  background: #fff;
  border-radius: 14px;
  padding: 16px;
  border: 1px solid #e5e7eb;
  font-size: 14px;
  line-height: 1.6;
  min-height: 60px;
  white-space: pre-wrap;
}

button {
  background: #2563eb;
  border: none;
  padding: 10px 18px;
  border-radius: 10px;
  color: #fff;
  cursor: pointer;
  font-size: 14px;
  margin-top: 6px;
}

.waitlist {
  background: #eef2ff;
  border: 1px dashed #6366f1;
  border-radius: 14px;
  padding: 16px;
}

.success { color: #047857; font-size: 13px; margin-top: 8px; }


.disclaimer { font-size: 12px; color: #6b7280; margin-top: 6px; }

.chat-window {
  background:#f3f4f6;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:14px;
  min-height:180px;
  max-height:360px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.chat-message {
  max-width:82%;
  padding:11px 13px;
  border-radius:14px;
  font-size:14px;
  line-height:1.55;
  white-space:pre-wrap;
}
.chat-message.user {
  align-self:flex-end;
  background:#2563eb;
  color:#fff;
  border-bottom-right-radius:5px;
}
.chat-message.baint {
  align-self:flex-start;
  background:#fff;
  color:#111827;
  border:1px solid #e5e7eb;
  border-bottom-left-radius:5px;
}
.chat-label {
  font-size:11px;
  font-weight:700;
  margin-bottom:4px;
  opacity:.7;
}
.question-row { display:flex; align-items:center; gap:8px; width:100%; }
.question-row input { flex:1; margin-right:0; }
.send-button { width:42px; height:42px; padding:0; margin-top:0; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; line-height:1; }
.voice-toggle { min-width:42px; }

</style>
</head>

<body>

<div class="laptop">
  <div class="top-bar">BAINT OS — Classroom Assistant Demo</div>
  <div class="screen-shell">

    <!-- LAUNCH -->
    <div id="app-launcher" class="section">

      <h3 style="cursor:pointer;" onclick="launchDemo()">Click to Launch BAINT Classroom Demo</h3>
      <div class="disclaimer">Prototype for testing. Answers come from a built-in lesson library, so some questions may not be covered yet. Human supervision encouraged.</div>
    </div>

    <!-- BOOT -->
    <div class="section" id="boot" style="display:none;">
      <div style="background:#111;color:#0f0;font-family:monospace;padding:20px;">
        <div id="boot-log"></div>
      </div>
    </div>

    <!-- DEMO -->
    <div id="demo" style="display:none;">

      <div class="section">
        <h4 id="label-setup">Learning Setup</h4>

        <select id="language" onchange="switchLanguage()">

          <option value="zh">🇨🇳 Chinese</option>
          <option value="fr">🇫🇷 French</option>
          <option value="es">🇪🇸 Spanish</option>

        </select>

      </div>

      <div class="section">
        <h4 id="label-assistant">BAINT AI Classroom Assistant</h4>

          <button id="btn-ask" class="send-button" onclick="answerQuestion()" aria-label="Send question" title="Send question">➤</button>
        </div>
      </div>

      </div>

    </div>
  </div>

function launchDemo(){
  appLauncher.style.display = "none";
  bootScreen.style.display  = "block";

  const lang = document.getElementById("language").value;
  const lines = ui[lang].boot;
  let i = 0;

  function run(){
    if(i < lines.length){
      bootLog.innerHTML += lines[i] + "<br>";
      i++;
      setTimeout(run, 500);
    } else {
      setTimeout(() => {

        demoScreen.style.display = "block";

  const lang = document.getElementById("language").value;

  document.getElementById("label-setup").innerText     = t.setup;
  document.getElementById("label-assistant").innerText = t.assistant;

/* ── TOPICS ── */
function getSubjectData(lang, subject){
  if(data[lang] && data[lang][subject]) return data[lang][subject];
  // Never fall back to English inside a selected non-English language.
  // Keep the topic structure, but let the response engine explain it in the selected language.
  const english = data.en[subject] || {};
  const synthetic = {};
  Object.keys(english).forEach(k => {
    synthetic[k] = "";
  });
  return synthetic;
}

function prettyTopic(topic){
  return topic.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}

function localizedTopicName(lang, topic){
  return topicLabels[lang]?.[topic] || prettyTopic(topic);
}

function updateTopics(){
  const lang    = document.getElementById("language").value;
  const subject = document.getElementById("subject").value;
  const topicEl = document.getElementById("topic");
  const subjectData = getSubjectData(lang, subject);
  const keys = Object.keys(subjectData);

  topicEl.innerHTML = "";
  keys.forEach(k => {
    const opt = document.createElement("option");
    opt.value = k;
    opt.innerText = localizedTopicName(lang, k);
    topicEl.appendChild(opt);
  });

  if(keys.length) topicEl.value = keys[0];
}

function localizedProfile(lang, subject){
  const p = localizedProfiles[lang]?.[subject] || localizedProfiles.en[subject] || ["the key ideas and how they connect","Check the main idea against the question."];
  return {focus:p[0], check:p[1]};
}

/* ── QUESTION-FOCUSED RESPONSE ENGINE ── */
let sessionFocus = { subject:"", topic:"", covered:[], lastFocus:"", concept:"", seen:{}, lastIntent:"" };

function resetSession(){
  sessionFocus = { subject:"", topic:"", covered:[], lastFocus:"", concept:"", seen:{}, lastIntent:"" };
}

function normalizeQuestion(q){
  return String(q || "").toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu," ").replace(/\s+/g," ").trim();
}

function questionHas(q, terms){
  const x = normalizeQuestion(q);
  return terms.some(t => x.includes(t));
}

function extractExample(base, lang){
  const lines = String(base || "").split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const hit = lines.find(x => /example|examples|例子|例|例え|예시|ตัวอย่าง|ví dụ|exemple|ejemplo|مثال/i.test(x));
  return hit || lines.find(x => /→|=/.test(x)) || lines[lines.length-2] || lines[0] || "";
}

function extractCore(base){
  const blocks = String(base || "").split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  return blocks[0] || String(base || "").split(/\n+/).filter(Boolean)[0] || "";
}

function pickQuestionFocus(question, subjectData, topic){
  const q = normalizeQuestion(question);

  // Follow-up questions often omit the subject they refer to. Use the
  // previous focus before falling back to the selected topic.
  const followUp = sessionFocus.lastFocus || sessionFocus.topic || topic || "";

  const aliases = [
    {terms:["carbohydrate","carbohydrates","carbs"], key:"__carbohydrates"},
    {terms:["lipid","lipids","fat","fats"], key:"__lipids"},
    {terms:["nucleic acid","nucleic acids","dna","rna"], key:"__nucleic_acids"},
    {terms:["protein","proteins","amino acid","amino acids"], key:"proteins_enzymes"},
    {terms:["enzyme","enzymes","active site","substrate"], key:"__enzymes"},
    {terms:["types of algebra","type of algebra","kinds of algebra"], key:"__algebra_types"},
    {terms:["example","examples"], key:"__examples"}
  ];

  // Semantic follow-ups should beat the generic topic.
  if(questionHas(q,["building block","building blocks","monomer","monomers","made of","made from","subunit","subunits"])) return "__building_blocks";
  if(questionHas(q,["structure","structures","structural"])){
    if(followUp === "proteins_enzymes") return "__protein_structure";
    if(followUp === "__carbohydrates") return "__carbohydrate_structure";
  }
  if(questionHas(q,["function","functions","role","roles","what does it do","what do they do"])) return "__function";
  if(questionHas(q,["relationship","related","relation","connection","how are they connected"])) return "__relationship";

  for(const a of aliases){
    if(a.terms.some(t=>q.includes(t))) return a.key;
  }

  const keys = Object.keys(subjectData || {});
  for(const k of keys){
    const label = localizedTopicName("en", k).toLowerCase();
    const pretty = prettyTopic(k).toLowerCase();
    if(q.includes(k.toLowerCase()) || q.includes(label) || q.includes(pretty)) return k;
  }

  // Pronouns such as “their”, “it” and “that” refer to the last concept.
  if(questionHas(q,["their","them","it","that","those","this"])) return followUp;

  return topic || "";
}

function focusedKnowledge(lang, focus, base, question){

  const example = extractExample(base, lang);
  const core = extractCore(base);
  const q = normalizeQuestion(question);

  const text = {
    __building_blocks: {
      en:`The building blocks depend on which biomolecule you mean.

• Carbohydrates → monosaccharides such as glucose
• Proteins → amino acids
• Nucleic acids → nucleotides

So “building block” means the smaller molecular units used to make or assemble a larger biological molecule.`
    },
    __protein_structure: {
      en:`Proteins are made from amino acids linked into polypeptide chains.

Their structure is commonly described at four levels: primary, secondary, tertiary and quaternary.

The final three-dimensional shape matters because structure influences how the protein interacts with other molecules and performs its function.`
    },
    __carbohydrate_structure: {
      en:`Carbohydrate structure starts with sugar units.

Monosaccharides are single sugar units. These can join to form disaccharides and longer polysaccharides.

The type and arrangement of the sugar units and their bonds affect the properties and functions of the carbohydrate.`
    },
    __function: {
      en:`Let's connect the current concept to its biological role.

For biomolecules, ask three things: what is it made of, what structure does it form, and what does that structure allow it to do?

That structure → function link is often more useful than memorizing a list.`
    },
    __relationship: {
      en:`Proteins and enzymes are closely related, but they are not identical ideas.

A protein is a type of biological molecule with a specific structure and function. An enzyme is a biological catalyst, and many enzymes are proteins.

The important connection is structure → active site → interaction with a substrate → faster reaction.`
    },
    __proteins_enzymes_followup: {
      en:`Proteins and enzymes are connected, but the terms are not interchangeable.

Proteins are polymers made from amino acids and can perform many different functions. Enzymes are biological catalysts that speed up reactions. Many enzymes are proteins, and their amino-acid sequence folds into a shape that creates an active site.

    },
    __carbohydrates: {
      en:`Carbohydrates are one of the four major biological macromolecule groups.\n\nBuilding blocks: many carbohydrates are built from monosaccharides such as glucose.\n\nMain types:\n• Monosaccharides: single sugar units\n• Disaccharides: two sugar units joined together\n• Polysaccharides: long chains of sugar units\n\nMain functions include providing energy and, in some forms, storing energy or providing structural support.\n\nExamples include glucose, sucrose and starch.`
    },
    __lipids:{en:`Lipids are a group of mostly water-insoluble biological molecules.\n\nThey include fats, oils, phospholipids and steroids.\n\nImportant roles include long-term energy storage, forming cell membranes and acting as signaling molecules.`},
    __nucleic_acids:{en:`Nucleic acids include DNA and RNA.\n\nTheir building blocks are nucleotides.\n\nDNA stores genetic information, while different types of RNA help use that information to make proteins and regulate cellular processes.`},
    __enzymes:{en:`Enzymes are biological catalysts. They help reactions happen faster without being consumed by the reaction.\n\nA substrate interacts with an enzyme's active site. The shape and chemical environment of the active site help the reaction occur.\n\nTemperature, pH, substrate concentration and inhibitors can affect enzyme activity.`},
    __algebra_types:{en:`There are several common ways algebra is studied.\n\n• Elementary algebra: variables, expressions and basic equations\n• Linear algebra: linear equations, vectors and matrices\n• Abstract algebra: structures such as groups, rings and fields\n• Boolean algebra: algebra based on true/false values and logical operations\n\nThe exact classification depends on the course, but the key idea is that different branches use algebraic reasoning for different kinds of problems.`},
    __examples:{en:`Here are a few examples related to the current topic:\n\n${example}\n\nIf you tell me the specific part you want examples for, I can narrow them down further.`}
  };

  if(focus === "proteins_enzymes" && sessionFocus.lastFocus === "__building_blocks") return text.__proteins_enzymes_followup.en;
  if(text[focus]?.[lang]) return text[focus][lang];
  if(text[focus]?.en) return text[focus].en;

  if(questionHas(q,["example","examples","例子","例","예시","ตัวอย่าง","ví dụ","exemple","ejemplo","مثال"])){
    return `${c.example}.\n\n${example}\n\n${c.check}: ${localizedProfile(lang, sessionFocus.subject).check}`;
  }

  if(questionHas(q,["continue","go on","next","more","keep going","继续","繼續","続け","계속","ต่อ","tiếp","continuer","continuar","تابع"])){
    const paragraphs = String(base || "").split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
    const nextIndex = paragraphs.findIndex((p,i)=>!sessionFocus.covered.includes(i) && p !== core);
    if(nextIndex >= 0){
      sessionFocus.covered.push(nextIndex);
      return `${c.start}.\n\n${paragraphs[nextIndex]}`;
    }
    return `${c.start}.\n\nHere is a deeper point about ${localizedTopicName(lang, sessionFocus.topic || focus)}:\n${core}\n\n${c.focus}: ${localizedProfile(lang, sessionFocus.subject).focus}`;
  }

  return "";
}

    overview:`Algebra is solving unknown values using symbols.\n\nA letter such as x stands for a number we don't know yet, and an equation shows how quantities are related. Solving means doing the same operation to both sides until the unknown stands alone.`,
    blocks:`Algebra is built from variables (letters standing for unknowns), constants, operations (+, −, ×, ÷) and the equals sign, which says both sides have the same value.`,
    types:`There are several common ways algebra is studied.\n\n• Elementary algebra: variables, expressions and basic equations\n• Linear algebra: linear equations, vectors and matrices\n• Abstract algebra: structures such as groups, rings and fields\n• Boolean algebra: logic with true/false values`,
    why:`Algebra matters because it lets you describe a pattern once and use it for any numbers, from budgets and speed calculations to science formulas and computer programs.`,
    practical:`Practical uses: working out discounts and loan costs, converting units, using physics and chemistry formulas, and writing code that works for any input.`,
    examples:[
      `Worked examples:\n\n• x + 5 = 10 → subtract 5 from both sides → x = 5\n• 2x + 3 = 11 → subtract 3 → 2x = 8 → divide by 2 → x = 4`,
      `Two more, slightly harder:\n\n• 3(x − 2) = 12 → expand: 3x − 6 = 12 → add 6: 3x = 18 → x = 6\n• x² = 16 → x = 4 or x = −4, because both square to 16`],
    simple:[
      `Algebra is a puzzle with a missing number. The letter x is the missing number, and you keep both sides of the equals sign balanced while you work out what it is.`,
      `Think of a balance scale: whatever you do to one side you must do to the other. x + 5 = 10 says "something plus 5 weighs the same as 10", so take 5 off each side and x = 5 is left.`],
    deeper:`Going deeper: solving is applying inverse operations in reverse order. Linear equations have one solution, quadratics can have two, and systems of equations look for values that satisfy several equations at once.` }
};

const conceptDetectors = [
  {key:"biomolecules",  re:/\bbiomolecules?\b|\bmacromolecules?\b/},
  {key:"carbohydrates", re:/\bcarbohydrates?\b|\bcarbs?\b|\bsaccharides?\b/},
  {key:"lipids",        re:/\blipids?\b|\bfats?\b/},
  {key:"nucleic_acids", re:/\bnucleic acids?\b|\bdna\b|\brna\b/},
  {key:"proteins",      re:/\bproteins?\b|\bamino acids?\b/},
  {key:"enzymes",       re:/\benzymes?\b|\bactive site\b/},
  {key:"algebra",       re:/\balgebra\b/}
];
const topicConcept = { biomolecules:"biomolecules", proteins_enzymes:"proteins_enzymes", algebra:"algebra" };
const aspectOrder = ["overview","blocks","function","why","examples","practical"];

function detectIntent(q){
  if(/\b(don t|dont|do not) (understand|get)\b|\bconfus|\blost\b|not clear|unclear|\bstuck\b/.test(q)) return "confusion";
  if(/\bsimpl|\beasier\b|\beli5\b|\bplain\b/.test(q)) return "simplify";
  if(/\bagain\b|another way|different way|\brephrase\b|\breword\b|differently/.test(q)) return "again";
  if(/\bexamples?\b|\binstances?\b|for instance/.test(q)) return "examples";
  if(/\bbuilding blocks?\b|\bmonomers?\b|\bsubunits?\b|made (of|from|up of)/.test(q)) return "blocks";
  if(/\btypes?\b|\bkinds?\b|\bcategories\b|\bclassif/.test(q)) return "types";
  if(/\bwhy\b|\bimportan|\bmatters?\b|\bsignifican/.test(q)) return "why";
  if(/\bfunctions?\b|\brole\b|\bpurpose\b|what (do|does) \w+ do\b/.test(q)) return "function";
  if(/\bapplications?\b|\bapply\b|real life|real world|practical|used for|used in|\buses\b/.test(q)) return "practical";
  if(/\bdeeper\b|more detail|\badvanced\b|go further|in depth|more about/.test(q)) return "deeper";
  return "";
}

function findConcept(q, subject){
  const hits = [];
  conceptDetectors.forEach(d=>{
    const m = q.match(d.re);
    if(m && conceptPacks[d.key].subjects.includes(subject)) hits.push({key:d.key, index:m.index});
  });
  if(!hits.length) return "";
  const keys = hits.map(h=>h.key);
  if(keys.includes("proteins") && keys.includes("enzymes")) return "proteins_enzymes";
  hits.sort((a,b)=>a.index-b.index);
  return hits[0].key;
}

function ctxChallenge(label){
  return `You've now covered the main points on ${label}. Try explaining it back in your own words, in a sentence or two, and I'll point out what's missing or where to push further.`;
}

function ctxNudge(label, pack, seen, lead){
  const names = {blocks:"its building blocks", function:"what it does", why:"why it matters", examples:"examples", practical:"where it is used in real life", deeper:"a deeper look"};
  const left = Object.keys(names).filter(k => pack[k] && !seen[k]);
  if(left.length >= 2){
    const shown = left.slice(0,3).map(k => names[k]);
    const list = shown.length === 1 ? shown[0] : shown.slice(0,-1).join(", ") + " or " + shown[shown.length-1];
    return `${lead}\n\nFrom here you could ask about ${list}.`;
  }
  return ctxChallenge(label);
}

function genericAspect(aspect, n, label, base, subject){
  const p = localizedProfile("en", subject);
  const lines = String(base || "").split(/\n+/).map(x=>x.trim()).filter(Boolean);
  if(aspect === "examples"){
    const ex = lines.filter(x=>/^example|e\.g\.|→/i.test(x));
    if(!ex.length) return "";   // nothing stored for this topic: let the existing logic answer
    return n < ex.length ? `Here is an example for ${label}:\n\n${ex[n]}` : `That is every example I have for ${label}. Tell me which part you want examples of and I will narrow it down.`;
  }
  const core = extractCore(base);
  const first = core.split(/(?<=[.!?])\s+/)[0] || core;
  if(n === 0) return `In one sentence: ${first}\n\nHold on to this: ${p.focus}.`;
  if(n === 1) return `Try three questions: what is ${label} about, what does it do, and how would you check it?\n\n${core}\n\nQuick check: ${p.check}`;
  return `I have put it a few ways now. Tell me which word or step lost you and I will break just that part down.`;
}

function contextReply(lang, subject, topic, question, base){
  if(lang !== "en") return "";
  const q = normalizeQuestion(question);
  if(!q) return "";
  const st = sessionFocus;
  st.seen = st.seen || {};

  const mention = findConcept(q, subject);
  const intent = detectIntent(q);
  const pronounAbout = /\b(what|how) about (them|it|that|this|those|these)\b/.test(q) ||
                       (/^(and )?(what|how) about\b/.test(q) && !mention);
  if(!intent && !mention && !pronounAbout) return "";

  const concept = mention || st.concept || topicConcept[topic] || topic;
  const switched = !!mention && mention !== st.concept;
  const pack = conceptPacks[concept] && conceptPacks[concept].subjects.includes(subject) ? conceptPacks[concept] : null;
  const label = pack ? pack.label : localizedTopicName("en", concept);
  const seen = st.seen[concept] = st.seen[concept] || {};
  const bump = k => { seen[k] = (seen[k] || 0) + 1; };

  let aspect = intent || (pronounAbout ? "__next" : "overview");
  if(aspect === "overview" && seen.overview && !switched) aspect = "again";

  let reply = "";
  if(!pack){
    // Generic concepts: only the follow-ups that are safe to answer from the topic text.
    if(!["examples","simplify","again","confusion"].includes(aspect)) return "";
    const kind = aspect === "examples" ? "examples" : "simple";
    const text = genericAspect(kind, seen[kind] || 0, label, getSubjectData("en", subject)[concept] || base, subject);
    if(!text) return "";
    bump(kind);
    st.concept = concept; st.lastIntent = aspect;
    return text;
  }

  if(["simplify","again","confusion"].includes(aspect)){
    const n = seen.simple || 0;
    const opener = aspect === "confusion" ? "No problem, let's come at it from a different angle.\n\n"
                 : aspect === "again" ? "Here's another way to see it.\n\n" : "Here's the simple version.\n\n";
    if(n < pack.simple.length){
      reply = opener + pack.simple[n];
    } else if(aspect === "again" && !seen.deeper){
      reply = "Let's go a level deeper instead of repeating myself.\n\n" + pack.deeper;
      bump("deeper");
    } else if(aspect === "again"){
      reply = ctxNudge(label, pack, seen, "We've been over this from a few angles.");
    } else {
      reply = "I've put it a few different ways now. Tell me which word or step lost you and I'll break just that part down.";
    }
    bump("simple");
  } else if(aspect === "examples"){
    const n = seen.examples || 0;
    reply = n < pack.examples.length ? pack.examples[n]
          : ctxNudge(label, pack, seen, `That's every example set I have for ${label.toLowerCase()}.`);
    bump("examples");
  } else if(aspect === "__next"){
    const next = aspectOrder.find(a => pack[a] && !seen[a]);
    if(next){ reply = Array.isArray(pack[next]) ? pack[next][0] : pack[next]; bump(next); }
    else if(!seen.deeper){ reply = pack.deeper; bump("deeper"); }
    else reply = ctxChallenge(label);
  } else {
    const key = aspect === "types" && !pack.types ? "overview" : aspect;
    if(!pack[key]) return "";
    if(seen[key] && key !== "deeper"){
      reply = !seen.deeper ? pack.deeper : ctxNudge(label, pack, seen, "We've covered that from a couple of angles.");
      bump("deeper");
    } else { reply = pack[key]; bump(key); }
  }

  st.concept = concept; st.lastIntent = aspect;
  return reply;
}

function makeSmartReply(lang, subject, topic, question, mode, base){
  const ctxReply = contextReply(lang, subject, topic, question, base);
  if(ctxReply){ sessionFocus.subject = subject; sessionFocus.topic = topic; return ctxReply; }
  const p = localizedProfile(lang, subject);
  const c = responseCopy[lang] || responseCopy.en;
  const type = detectQuestionType(question, lang);
  const previousFocus = sessionFocus.lastFocus;
  const focus = pickQuestionFocus(question, getSubjectData(lang, subject), topic);
  sessionFocus.subject = subject;
  sessionFocus.topic = topic;

  const targeted = focusedKnowledge(lang, focus, base, question);
  sessionFocus.lastFocus = focus;
  if(targeted){
    return `${targeted}\n\n${c.focus}: ${p.focus}`;
  }

  const topicName = localizedTopicName(lang, focus || topic || subject);
  const cleanBase = base || "";
  const firstLine = extractCore(cleanBase);
  const opening = {
    calculation:c.calculation, why:c.why, compare:c.compare,
    application:c.application, confusion:c.confusion,
    definition:c.definition, concept:c.concept
  }[type] || c.concept;

  if(type === "calculation") {
    return `${opening}: ${topicName}\n\n${c.start}.\n\n1. ${lang==='zh'?'找出已知量和单位':lang==='ja'?'既知の値と単位を確認します':lang==='ko'?'주어진 값과 단위를 확인합니다':lang==='th'?'ระบุค่าที่ให้มาและหน่วย':lang==='vi'?'Xác định các giá trị và đơn vị đã biết':lang==='fr'?'Identifiez les valeurs connues et leurs unités':lang==='es'?'Identifica los valores conocidos y sus unidades':lang==='ar'?'حدد القيم المعروفة ووحداتها':'Identify the known values and their units.'}\n2. ${lang==='zh'?'选择连接这些量的公式或原理':lang==='ja'?'関係する公式や原理を選びます':lang==='ko'?'연결되는 공식이나 원리를 선택합니다':lang==='th'?'เลือกสมการหรือหลักการที่เกี่ยวข้อง':lang==='vi'?'Chọn công thức hoặc nguyên lý phù hợp':lang==='fr'?'Choisissez l’équation ou le principe adapté':lang==='es'?'Elige la ecuación o principio adecuado':lang==='ar'?'اختر المعادلة أو المبدأ المناسب':'Choose the equation or principle that connects them.'}\n3. ${lang==='zh'?'代入数值并计算':lang==='ja'?'値を代入して計算します':lang==='ko'?'값을 대입하고 계산합니다':lang==='th'?'แทนค่าและคำนวณ':lang==='vi'?'Thay số và tính toán':lang==='fr'?'Remplacez les valeurs et calculez':lang==='es'?'Sustituye los valores y calcula':lang==='ar'?'عوّض القيم واحسب':'Substitute the values and calculate.'}\n4. ${p.check}\n\n${c.focus}: ${p.focus}${cleanBase ? `\n\n${firstLine}` : ''}`;
  }

  if(type === "definition") return `${opening}: ${topicName}\n\n${firstLine || topicName}\n\n${lang==='zh'?'然后理解它做什么、如何运作以及在哪里使用。':lang==='ja'?'次に、何をするのか、どう働くのか、どこで使うのかを見ます。':lang==='ko'?'그다음 무엇을 하는지, 어떻게 작동하는지, 어디에 쓰이는지 봅니다.':lang==='th'?'จากนั้นดูว่ามันทำอะไร ทำงานอย่างไร และใช้ที่ไหน':lang==='vi'?'Sau đó xem nó làm gì, hoạt động thế nào và được dùng ở đâu.':lang==='fr'?'Ensuite, voyez ce que cela fait, comment cela fonctionne et où on l’utilise.':lang==='es'?'Después mira qué hace, cómo funciona y dónde se usa.':lang==='ar'?'ثم انظر إلى ما يفعله وكيف يعمل وأين يُستخدم.':'Then look at what it does, how it works and where it is used.'}\n\n${c.focus}: ${p.focus}`;

  return `${opening}: ${topicName}\n\n${firstLine || topicName}\n\n${c.focus}: ${p.focus}\n${c.check}: ${p.check}`;
}

let chatMessages = [];
let lastAssistantReply = "";

function renderChat(){
  const box = document.getElementById("explanation");
  box.innerHTML = "";
  if(!chatMessages.length){
    const welcome = document.createElement("div");
    welcome.className = "chat-message baint";
    welcome.innerHTML = 'Ask a question and I will explain the selected topic clearly';
    box.appendChild(welcome);
    return;
  }
  chatMessages.forEach(m => {
    const el = document.createElement("div");
    el.className = `chat-message ${m.role}`;
    const label = m.role === "user" ? "You" : "";
    el.innerHTML = label ? `<div class="chat-label">${label}</div>${escapeHtml(m.text)}` : escapeHtml(m.text);
    box.appendChild(el);
  });
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(text){
  return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function updateContent(){
  resetSession();
  chatMessages = [];
  lastAssistantReply = "";
  stopVoice();
  renderChat();
}

/* ── VOICE ── */
let utterance;
let voicePlaying = false;

function getVoice(lang){
  const voices = speechSynthesis.getVoices();
  return voices.find(v => v.lang.toLowerCase().startsWith(lang.toLowerCase())) || null;
}

function toggleVoice(){
  if(voicePlaying){
    stopVoice();
    return;
  }

  const lang = document.getElementById("language").value;
  const text = lastAssistantReply.trim();
  if(!text) return;

  speechSynthesis.cancel();
  const voice = getVoice(voiceMap[lang]);
  if(!voice){
    document.getElementById("btn-voice").innerText = ui[lang].speak;
    return;
  }
  utterance = new SpeechSynthesisUtterance(text);
  utterance.voice = voice;
  utterance.lang = voiceMap[lang];
  utterance.onstart = () => {
    voicePlaying = true;
    document.getElementById("btn-voice").innerText = "⏹ Stop";
  };
  utterance.onend = utterance.onerror = () => {
    voicePlaying = false;
    document.getElementById("btn-voice").innerText = ui[lang].speak;
  };
  speechSynthesis.speak(utterance);
}

function stopVoice(){
  speechSynthesis.cancel();
  voicePlaying = false;
  const lang = document.getElementById("language").value;
  document.getElementById("btn-voice").innerText = ui[lang].speak;
}

speechSynthesis.onvoiceschanged = () => { speechSynthesis.getVoices(); };

renderChat();

/* ── QUESTION ── */
function answerQuestion(){
  const lang = document.getElementById("language").value;
  const q    = document.getElementById("studentQuestion").value.trim();
  const s    = document.getElementById("subject").value;
  const t    = document.getElementById("topic").value;
  const mode = document.getElementById("mode").value;
  const subjectData = getSubjectData(lang, s);
  const base = subjectData[t] || data.en[s]?.[t] || `This question is about ${prettyTopic(t || s)}.`;

  if(!q) return;

  stopVoice();
  if(sessionFocus.subject !== s || sessionFocus.topic !== t) resetSession();
  sessionFocus.subject = s;
  sessionFocus.topic = t;

  const focus = pickQuestionFocus(q, subjectData, t);
  const reply = makeSmartReply(lang, s, t, q, mode, subjectData[focus] || base);

  chatMessages.push({role:"user", text:q});
  chatMessages.push({role:"baint", text:reply});
  lastAssistantReply = reply;
  renderChat();
  document.getElementById("studentQuestion").value = "";
}
